name: Build Portainer test image

on:
  push:
    branches:
      - portainer-test
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ronron1982/icetv:portainer-test
            ghcr.io/ronron1982/icetv:traditional-chinese-support
            ghcr.io/ronron1982/icetv:portainer-test-${{ github.sha }}
            ghcr.io/ronron1982/icetv:traditional-chinese-support-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=traditional-chinese-support
